node:
  id: 2
network:
  bind: 0.0.0.0
  client_port: 7402
  raft_port: 7502
cluster:
  nodes:
    - id: 1
      host: 127.0.0.1
      raft_port: 7501
      client_port: 7401
    - id: 2
      host: 127.0.0.1
      raft_port: 7502
      client_port: 7402
    - id: 3
      host: 127.0.0.1
      raft_port: 7503
      client_port: 7403
security:
  requirepass: ${STRONGKV_PASSWORD}
storage:
  data_dir: ./data/node2
  raft_log_dir: ./data/node2/raft
  snapshot_dir: ./data/node2/snapshot
raft:
  heartbeat_ms: 100
  election_timeout_lower_ms: 300
  election_timeout_upper_ms: 600
  client_request_timeout_ms: 5000
  snapshot_distance: 1000000
  reserved_log_items: 100000
server:
  max_connections: 10000
  max_request_size: 1048576
logging:
  level: warn
  path: ./logs/node2.log
